<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBot — your machine</title>
    <style>
      :root {
        --bg: #10140f;
        --panel: #171d16;
        --ink: #e7eedc;
        --muted: #8b9778;
        --line: #2b3526;
        --phosphor: #b6e36a;
        --amber: #e2b14a;
        --danger: #e07a5f;
        --ok: #7dce82;
        --mono: "IBM Plex Mono", "ui-monospace", "SFMono-Regular", Menlo, Consolas, monospace;
        --sans: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body {
        font-family: var(--sans);
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100dvh;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: flex-start;
        padding: 1.1rem 1.4rem 0.9rem;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #1a2217 0%, var(--bg) 100%);
      }
      .brand { display: flex; flex-direction: column; gap: 0.2rem; }
      .brand h1 {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .brand p { margin: 0; color: var(--muted); font-size: 0.92rem; }
      .lamp {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--danger);
        margin-right: 0.4rem;
        box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15);
      }
      .lamp.ok {
        background: var(--phosphor);
        box-shadow: 0 0 0 3px rgba(182, 227, 106, 0.18);
      }
      .meta {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--muted);
        text-align: right;
        line-height: 1.55;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        min-height: 0;
      }
      @media (max-width: 840px) {
        main { grid-template-columns: 1fr; }
        aside { display: none; }
      }
      #log {
        overflow: auto;
        padding: 1.1rem 1.4rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.7rem;
      }
      .msg {
        max-width: min(36rem, 78%);
        width: fit-content;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 0.85rem;
      }
      .msg.user {
        align-self: flex-end;
        margin-left: auto;
        border-color: #3a3420;
        background: #222012;
      }
      .msg.user h3 { text-align: right; }
      .msg.bot {
        align-self: flex-start;
        margin-right: auto;
        border-color: #2d3a22;
      }
      .msg.sys {
        align-self: center;
        max-width: min(42rem, 92%);
        width: auto;
        border: none;
        background: transparent;
        padding: 0.2rem 0.4rem;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.8rem;
      }
      .msg h3 {
        margin: 0 0 0.35rem;
        font-family: var(--sans);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--muted);
      }
      .msg.bot pre {
        color: var(--ink);
        font-family: var(--sans);
        font-size: 1rem;
      }
      .msg.user pre {
        color: var(--ink);
        font-family: var(--sans);
        font-size: 1rem;
      }
      .quiet {
        margin-top: 0.35rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
      }
      .msg pre, .out {
        margin: 0.4rem 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--mono);
        font-size: 0.82rem;
        color: #d5e8b8;
      }
      .approval {
        align-self: stretch;
        max-width: none;
        width: auto;
        border-color: var(--amber);
        background: #241c0e;
        border-radius: 0.5rem;
      }
      .approval button, footer button, footer select {
        font-family: var(--mono);
        font-size: 0.78rem;
        border: 1px solid var(--line);
        background: #22291d;
        color: var(--ink);
        padding: 0.45rem 0.7rem;
        cursor: pointer;
      }
      .approval button.yes { border-color: var(--phosphor); color: var(--phosphor); }
      .approval button.no { border-color: var(--danger); color: var(--danger); }
      aside {
        border-left: 1px solid var(--line);
        padding: 1rem;
        overflow: auto;
        background: #141a12;
      }
      aside h2 {
        margin: 0 0 0.6rem;
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-family: var(--mono);
      }
      .job {
        font-family: var(--mono);
        font-size: 0.72rem;
        border: 1px solid var(--line);
        padding: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .job strong { color: var(--phosphor); }
      footer {
        border-top: 1px solid var(--line);
        padding: 0.8rem 1.2rem 1rem;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.5rem;
        background: #141a12;
      }
      footer textarea {
        resize: none;
        min-height: 2.6rem;
        max-height: 8rem;
        border: 1px solid var(--line);
        background: #0e120d;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 1rem;
        padding: 0.55rem 0.7rem;
      }
      footer textarea:focus { outline: 1px solid var(--phosphor); }
      .err { color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1><span id="lamp" class="lamp"></span>OpenBot</h1>
        <p>SSH your own machine. The agent gets a computer — you keep the keys. <a href="/oh-test" style="color:var(--phosphor)">本机试连</a></p>
      </div>
      <div class="meta" id="meta">connecting…</div>
    </header>
    <main>
      <section id="log"></section>
      <aside>
        <h2>On this computer</h2>
        <div id="jobs">Handed-off conversations persist on the host.</div>
      </aside>
    </main>
    <footer>
      <select id="mode" aria-label="Input mode">
        <option value="handoff">This computer</option>
        <option value="run">Run on host</option>
      </select>
      <textarea id="box" rows="2" placeholder="发给这台电脑，直接开始对话。"></textarea>
      <button id="send" type="button">Send</button>
    </footer>
    <script>
      const logEl = document.getElementById("log");
      const jobsEl = document.getElementById("jobs");
      const box = document.getElementById("box");
      const mode = document.getElementById("mode");
      const sendBtn = document.getElementById("send");
      const meta = document.getElementById("meta");
      const lamp = document.getElementById("lamp");

      function add(kind, title, body, extra) {
        const el = document.createElement("article");
        el.className = "msg " + kind;
        if (title) {
          const h = document.createElement("h3");
          h.textContent = title;
          el.appendChild(h);
        }
        const pre = document.createElement(kind === "sys" ? "div" : "pre");
        pre.textContent = body || "";
        el.appendChild(pre);
        if (extra) el.appendChild(extra);
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
        return el;
      }

      async function refreshStatus() {
        try {
          const s = await (await fetch("/api/status")).json();
          const ohOk = !!(s.openhands && s.openhands.ok);
          lamp.classList.toggle("ok", ohOk || !!s.ok);
          const host = s.host || {};
          const info = s.info;
          const hostLine = host.hostname ? host.user + "@" + host.hostname : "no SSH bind (OH-only is ok)";
          meta.innerHTML =
            escapeHtml(hostLine) +
            (s.openhands
              ? "<br>OH " +
                (ohOk ? "ok" : "down") +
                " " +
                escapeHtml(s.openhands.baseUrl || "") +
                (s.openhands.hasSessionKey ? "" : " · set OH_SESSION_API_KEY")
              : "<br>OH not configured") +
            "<br>persist " + escapeHtml(s.persist || "unknown") +
            (info ? "<br>" + escapeHtml(info.uname.string) : "") +
            (s.error && !ohOk ? "<br class='err'>" + escapeHtml(s.error) : "");
        } catch (err) {
          lamp.classList.remove("ok");
          meta.textContent = String(err);
        }
      }

      async function refreshJobs() {
        try {
          const conv = await (await fetch("/api/conversations")).json();
          const items = conv.conversations || [];
          if (items.length) {
            jobsEl.innerHTML = items
              .slice(0, 12)
              .map((c) => {
                return (
                  '<div class="job"><strong>' +
                  escapeHtml(c.status || c.execution_status) +
                  "</strong> " +
                  escapeHtml(c.id) +
                  "</div>"
                );
              })
              .join("");
            return;
          }
          const data = await (await fetch("/api/jobs")).json();
          const jobs = data.jobs || [];
          if (!jobs.length) {
            jobsEl.textContent = "No conversations yet. Send a message to start one.";
            return;
          }
          jobsEl.innerHTML = jobs
            .slice(0, 12)
            .map((j) => {
              return (
                '<div class="job"><strong>' +
                escapeHtml(j.status) +
                "</strong> " +
                escapeHtml(j.id) +
                "<br>" +
                escapeHtml(j.command) +
                "</div>"
              );
            })
            .join("");
        } catch {
          /* tunnel may be reconnecting */
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      async function consumeSse(url, payload, onEvent) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok || !res.body) {
          const t = await res.text();
          throw new Error(t || res.status);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop() || "";
          for (const part of parts) {
            const line = part.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            onEvent(JSON.parse(line.slice(6)));
          }
        }
      }

      function decideCard(ev, extraLines) {
        const actions = document.createElement("div");
        const yes = document.createElement("button");
        yes.className = "yes";
        yes.textContent = "Approve";
        const no = document.createElement("button");
        no.className = "no";
        no.textContent = "Deny";
        actions.append(yes, no);
        const card = add("approval", "approval gate", extraLines, actions);
        const decide = async (allow) => {
          yes.disabled = no.disabled = true;
          await fetch("/api/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: ev.id, allow }),
          });
          card.querySelector("h3").textContent = allow ? "approved" : "denied";
        };
        yes.onclick = () => decide(true);
        no.onclick = () => decide(false);
      }

      async function send() {
        const text = box.value.trim();
        if (!text) return;
        box.value = "";
        const isRun = mode.value === "run";
        add("user", isRun ? "Run on host" : "You", text);
        const out = add("bot", isRun ? "Host" : "Assistant", "");
        const pre = out.querySelector("pre");
        let quiet = out.querySelector(".quiet");
        if (!quiet) {
          quiet = document.createElement("div");
          quiet.className = "quiet";
          out.appendChild(quiet);
        }
        sendBtn.disabled = true;
        try {
          const url = isRun ? "/api/run" : "/api/chat";
          const payload = isRun ? { command: text } : { message: text, handoff: true };
          await consumeSse(url, payload, (ev) => {
            if (isRun) {
              if (ev.type === "token" || ev.type === "thought" || ev.type === "output") {
                if (pre.textContent) pre.textContent += "\n";
                pre.textContent += ev.text || ev.chunk || "";
                logEl.scrollTop = logEl.scrollHeight;
              } else if (ev.type === "status") {
                add("sys", "host", ev.text);
              } else if (ev.type === "tool_start") {
                add("sys", "tool", ev.name + " " + JSON.stringify(ev.args));
              } else if (ev.type === "tool_result") {
                add("sys", "host", ev.name + "\n" + (ev.result || ""));
              } else if (ev.type === "approval") {
                decideCard(ev, ev.reason + "\n" + ev.command);
              } else if (ev.type === "error") {
                add("sys err", "error", ev.message);
              } else if (ev.type === "done") {
                refreshJobs();
              }
              return;
            }
            if (ev.type === "token") {
              pre.textContent = ev.text || "";
              quiet.textContent = "";
              logEl.scrollTop = logEl.scrollHeight;
            } else if (ev.type === "status") {
              if (!pre.textContent) quiet.textContent = ev.text === "thinking" ? "…" : ev.text;
            } else if (ev.type === "error") {
              add("sys err", "error", ev.message);
            } else if (ev.type === "done") {
              quiet.textContent = "";
              refreshJobs();
            }
          });
        } catch (err) {
          add("sys err", "error", String(err));
        } finally {
          sendBtn.disabled = false;
          box.focus();
        }
      }

      sendBtn.onclick = send;
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      refreshStatus();
      refreshJobs();
      setInterval(refreshStatus, 8000);
      setInterval(refreshJobs, 5000);
      add(
        "sys",
        "",
        "发给这台电脑就会直接对话。先开隧道：ssh -L 127.0.0.1:8000:127.0.0.1:8000 user@host",
      );
    </script>
  </body>
</html>

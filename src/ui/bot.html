<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenBot · 独立测试入口</title><style>
:root{font-family:system-ui,sans-serif;color:#202331;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:white;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small,.hint{color:#626879}main{max-width:1200px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:1.5fr 1fr;gap:22px}section{background:white;padding:22px;border:1px solid #e0e3ec;border-radius:12px;margin-bottom:18px}h2{font-size:17px;margin-top:0}input,textarea,button{font:inherit;border:1px solid #c6cbd7;border-radius:7px;padding:10px}input,textarea{width:100%;margin:7px 0 14px}textarea{min-height:95px;resize:vertical}button{cursor:pointer;background:#fff}button.primary{background:#5141c6;color:white;border-color:#5141c6}button:disabled{opacity:.5;cursor:wait}a{color:#5141c6}label{font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.task{padding:14px 0;border-bottom:1px solid #eee}.task button{margin:6px 6px 0 0}.state{font-size:13px;color:#5141c6}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fb;padding:12px;max-height:300px;overflow:auto}.error{color:#a12e22}.notice{padding:12px;background:#efecff;border-radius:7px}#files button{display:block;border:0;padding:7px;color:#5141c6;text-align:left}@media(max-width:750px){main{display:block}header{gap:15px}small{display:block}}
</style></head><body><header><div><h1>OpenBot</h1><small>独立测试入口 · 任务留在你的 ECS 上</small></div><a href="/">返回聊天与主机设置</a></header><main><div><section><h2>交给 Bot 一件事</h2><p class="hint">用自然语言描述目标和文件名。确认任务已接收后，关闭页面不影响远端执行。</p><form id="submit"><label for="goal">任务目标</label><textarea id="goal" required placeholder="在工作区创建 notes.md，写下三条准备事项，然后读回内容。"></textarea><button class="primary" id="send">提交任务</button></form><p id="submit-status" aria-live="polite"></p></section><section><div class="row"><h2>任务与结果</h2><button id="refresh">刷新</button></div><p id="task-status" aria-live="polite"></p><div id="tasks"></div></section></div><div><section><h2>连接我的 ECS</h2><p class="hint">SSH 主机沿用原设置。ECS 上需要启动 Bot runtime；桌面服务不是必需项。</p><form id="connect"><label for="token">Bot 服务令牌</label><input id="token" type="password" autocomplete="off" placeholder="首次连接填写，之后可留空"><label for="port">远端服务端口</label><input id="port" type="number" min="1" max="65535" value="3850"><button class="primary">连接 / 恢复连接</button></form><p id="connection" aria-live="polite">正在读取连接配置…</p></section><section><h2>工作区文件</h2><form id="browse"><label for="directory">相对目录</label><input id="directory" value="" placeholder="留空查看工作区"><button>查看文件</button></form><div id="files"></div><pre id="preview" hidden></pre></section></div></main><script type="module">
const session='__SESSION__';
const $=id=>document.getElementById(id);
let threadId=localStorage.getItem('openbot-bot-thread');if(!threadId){threadId=crypto.randomUUID();localStorage.setItem('openbot-bot-thread',threadId)}
let pending=JSON.parse(localStorage.getItem('openbot-bot-pending')||'null');if(pending)$('goal').value=pending.goal;
let connected=false,busy=false;
const labels={queued:'已接收 · 排队中',starting:'正在提交给执行服务',running:'执行中',waiting_approval:'等待你批准',paused:'已暂停',succeeded:'已完成',failed:'执行失败',interrupted:'已中断 · 请核对远端状态'};
async function api(route,method='GET',data){const r=await fetch('/api/bot/'+route,{method,headers:{'Content-Type':'application/json','X-OpenBot-Session':session},body:data===undefined?undefined:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'请求失败');return b}
function note(id,text,error=false){$(id).textContent=text;$(id).className=error?'error':'hint'}
async function refresh(){if(!connected||busy)return;busy=true;try{const b=await api('tasks');$('tasks').replaceChildren();note('task-status',b.tasks.length?'任务状态来自 ECS；失联不会自动重做。':'还没有任务。');for(const t of b.tasks){const box=document.createElement('div');box.className='task';const title=document.createElement('p');title.textContent=t.goal;const state=document.createElement('div');state.className='state';state.textContent=(labels[t.status]||t.status)+' · '+t.id.slice(0,8);box.append(title,state);if(t.result||t.error){const p=document.createElement('pre');p.textContent=t.result||t.error;box.append(p)}if(t.pendingActions?.length){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent='查看待执行动作';p.textContent=JSON.stringify(t.pendingActions,null,2);d.append(s,p);box.append(d)}const action=(label,verb,accept)=>{const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{btn.disabled=true;try{await api('tasks/'+t.id+'/'+verb,'POST',{revision:t.revision,accept});await refresh()}catch(e){note('task-status',e.message,true)}finally{btn.disabled=false}};box.append(btn)};if(t.status==='waiting_approval'){action('允许本次动作','approval',true);action('拒绝','approval',false)}if(t.status==='running')action('暂停','pause');if(t.status==='paused'&&!t.error)action('继续','resume');if(t.error||t.status==='paused')action('核对执行状态','refresh');$('tasks').append(box)}}catch(e){note('task-status','连接中断，已有任务保持原状态。'+e.message,true)}finally{busy=false}}
$('connect').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;note('connection','正在建立 SSH 隧道并验证 Bot 身份…');try{const token=$('token').value.trim();const d=await api('connect','POST',token?{token,remotePort:Number($('port').value)}:{});$('token').value='';connected=true;note('connection',d.execution.ok?'已连接 · 执行服务可用':'Bot 已连接，但执行服务不可达');await refresh()}catch(e){connected=false;note('connection',e.message,true)}finally{btn.disabled=false}};
$('submit').onsubmit=async e=>{e.preventDefault();if(!connected){note('submit-status','请先连接 ECS。',true);return}const goal=$('goal').value.trim();if(!goal)return;if(pending&&pending.goal!==goal){note('submit-status','上一条提交结果尚未确认，请先恢复原目标重试或在任务列表核对。',true);$('goal').value=pending.goal;return}pending=pending||{requestId:crypto.randomUUID(),threadId,goal,source:{kind:'openbot'}};localStorage.setItem('openbot-bot-pending',JSON.stringify(pending));$('send').disabled=true;try{const b=await api('tasks','POST',pending);pending=null;localStorage.removeItem('openbot-bot-pending');$('goal').value='';note('submit-status','ECS 已接收：'+b.task.id+'。可以关闭页面，稍后恢复查看。');await refresh()}catch(e){note('submit-status','尚未确认接收；再次提交将沿用原请求编号，避免重复执行。'+e.message,true)}finally{$('send').disabled=false}};
$('refresh').onclick=refresh;
$('browse').onsubmit=async e=>{e.preventDefault();try{const b=await api('files?path='+encodeURIComponent($('directory').value));$('files').replaceChildren();for(const f of b.entries){const btn=document.createElement('button');btn.textContent=(f.type==='directory'?'📁 ':'📄 ')+f.name;btn.onclick=async()=>{try{if(f.type==='directory'){$('directory').value=f.path;$('browse').requestSubmit();return}const file=await api('file?path='+encodeURIComponent(f.path));$('preview').hidden=false;$('preview').textContent=file.path+'\nSHA256: '+file.sha256+'\n\n'+file.content}catch(e){note('files',e.message,true)}};$('files').append(btn)}}catch(e){note('files',e.message,true)}};
try{const c=await api('connection');note('connection',c.configured?'已保存连接，可恢复查看原任务。':'请先配置 SSH 主机，然后填写 Bot 服务令牌。');if(c.configured)$('connect').requestSubmit()}catch(e){note('connection',e.message,true)}
setInterval(refresh,3000);
</script></body></html>

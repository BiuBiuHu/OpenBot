<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="OpenBot · 独立测试入口">OpenBot · 独立测试入口</title><style>
:root{font-family:system-ui,sans-serif;color:#202331;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:white;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small,.hint{color:#626879}main{max-width:1200px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:1.5fr 1fr;gap:22px}section{background:white;padding:22px;border:1px solid #e0e3ec;border-radius:12px;margin-bottom:18px}h2{font-size:17px;margin-top:0}input,textarea,button{font:inherit;border:1px solid #c6cbd7;border-radius:7px;padding:10px}input,textarea{width:100%;margin:7px 0 14px}textarea{min-height:95px;resize:vertical}button{cursor:pointer;background:#fff}button.primary{background:#5141c6;color:white;border-color:#5141c6}button:disabled{opacity:.5;cursor:wait}a{color:#5141c6}label{font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.task{padding:14px 0;border-bottom:1px solid #eee}.task button{margin:6px 6px 0 0}.state{font-size:13px;color:#5141c6}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fb;padding:12px;max-height:300px;overflow:auto}.error{color:#a12e22}.notice{padding:12px;background:#efecff;border-radius:7px}#files button{display:block;border:0;padding:7px;color:#5141c6;text-align:left}@media(max-width:750px){main{display:block}header{gap:15px}small{display:block}}
</style></head><body><header><div><h1>OpenBot</h1><small data-i18n="独立测试入口 · 任务留在你的 ECS 上">独立测试入口 · 任务留在你的 ECS 上</small></div><a href="/" data-i18n="返回聊天与主机设置">返回聊天与主机设置</a><label class="ui-language"><span data-i18n="界面语言">Language</span> <select data-language-picker aria-label="Interface language" data-i18n-aria-label="界面语言"><option value="auto" data-i18n="跟随浏览器">Browser default</option><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></header><main><div><section><h2 data-i18n="交给 Bot 一件事">交给 Bot 一件事</h2><p class="hint" data-i18n="用自然语言描述目标和文件名。确认任务已接收后，关闭页面不影响远端执行。">用自然语言描述目标和文件名。确认任务已接收后，关闭页面不影响远端执行。</p><form id="submit"><label for="goal" data-i18n="任务目标">任务目标</label><textarea id="goal" required placeholder="在工作区创建 notes.md，写下三条准备事项，然后读回内容。" data-i18n-placeholder="在工作区创建 notes.md，写下三条准备事项，然后读回内容。"></textarea><button class="primary" id="send" data-i18n="提交任务">提交任务</button></form><p id="submit-status" aria-live="polite"></p></section><section><div class="row"><h2 data-i18n="任务与结果">任务与结果</h2><button id="refresh" data-i18n="刷新">刷新</button></div><p id="task-status" aria-live="polite"></p><div id="tasks"></div></section></div><div><section><h2 data-i18n="连接我的 ECS">连接我的 ECS</h2><p class="hint" data-i18n="SSH 主机沿用原设置。ECS 上需要启动 Bot runtime；桌面服务不是必需项。">SSH 主机沿用原设置。ECS 上需要启动 Bot runtime；桌面服务不是必需项。</p><form id="connect"><label for="token" data-i18n="Bot 服务令牌">Bot 服务令牌</label><input id="token" type="password" autocomplete="off" placeholder="首次连接填写，之后可留空" data-i18n-placeholder="首次连接填写，之后可留空"><label for="port" data-i18n="远端服务端口">远端服务端口</label><input id="port" type="number" min="1" max="65535" value="3850"><button class="primary" data-i18n="连接 / 恢复连接">连接 / 恢复连接</button></form><p id="connection" aria-live="polite" data-i18n="正在读取连接配置…">正在读取连接配置…</p></section><section><h2 data-i18n="工作区文件">工作区文件</h2><form id="browse"><label for="directory" data-i18n="相对目录">相对目录</label><input id="directory" value="" placeholder="留空查看工作区" data-i18n-placeholder="留空查看工作区"><button data-i18n="查看文件">查看文件</button></form><div id="files"></div><pre id="preview" hidden></pre></section></div></main><script type="module">
import { t, setText, uiText, initI18n } from '/i18n.js';
initI18n();

const session='__SESSION__';
const $=id=>document.getElementById(id);
let threadId=localStorage.getItem('openbot-bot-thread');if(!threadId){threadId=crypto.randomUUID();localStorage.setItem('openbot-bot-thread',threadId)}
let pending=JSON.parse(localStorage.getItem('openbot-bot-pending')||'null');if(pending)$('goal').value=pending.goal;
let connected=false,busy=false;
const labels={queued:t('已接收 · 排队中'),starting:t('正在提交给执行服务'),running:t('执行中'),waiting_approval:t('等待你批准'),paused:t('已暂停'),succeeded:t('已完成'),failed:t('执行失败'),interrupted:t('已中断 · 请核对远端状态')};
async function api(route,method='GET',data){const r=await fetch('/api/bot/'+route,{method,headers:{'Content-Type':'application/json','X-OpenBot-Session':session},body:data===undefined?undefined:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(r.status===403?t('页面连接凭据已失效，请刷新页面后重试。'):b.error||t('请求失败'));return b}
function note(id,text,error=false){uiText($(id),text);$(id).className=error?'error':'hint'}
async function refresh(){if(!connected||busy)return;busy=true;try{const b=await api('tasks');$('tasks').replaceChildren();note('task-status',b.tasks.length?t('任务状态来自 ECS；失联不会自动重做。'):t('还没有任务。'));for(const task of b.tasks){const box=document.createElement('div');box.className='task';const title=document.createElement('p');title.textContent=task.goal;const state=document.createElement('div');state.className='state';setText(state,()=>(t(labels[task.status])||task.status)+' · '+task.id.slice(0,8));box.append(title,state);if(task.result||task.error){const p=document.createElement('pre');p.textContent=task.result||task.error;box.append(p)}if(task.pendingActions?.length){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');setText(s, () => t('查看待执行动作'));p.textContent=JSON.stringify(task.pendingActions,null,2);d.append(s,p);box.append(d)}const action=(label,verb,accept)=>{const btn=document.createElement('button');uiText(btn,label);btn.onclick=async()=>{btn.disabled=true;try{await api('tasks/'+task.id+'/'+verb,'POST',{revision:task.revision,accept});await refresh()}catch(e){note('task-status',e.message,true)}finally{btn.disabled=false}};box.append(btn)};if(task.status==='waiting_approval'){action(t('允许本次动作'),'approval',true);action(t('拒绝'),'approval',false)}if(task.status==='running')action(t('暂停'),'pause');if(task.status==='paused'&&!task.error)action(t('继续'),'resume');if(task.error||task.status==='paused')action(t('核对执行状态'),'refresh');$('tasks').append(box)}}catch(e){connected=false;note('connection',t('连接已中断，请恢复连接；若本地服务已重启，请刷新页面。'),true);note('task-status',t('连接中断，已有任务保持原状态。')+e.message,true)}finally{busy=false}}
$('connect').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;note('connection',t('正在建立 SSH 隧道并验证 Bot 身份…'));try{const token=$('token').value.trim();const d=await api('connect','POST',token?{token,remotePort:Number($('port').value)}:{});$('token').value='';connected=true;note('connection',d.execution.ok?t('已连接 · 执行服务可用'):t('Bot 已连接，但执行服务不可达'));await refresh()}catch(e){connected=false;note('connection',e.message,true)}finally{btn.disabled=false}};
$('submit').onsubmit=async e=>{e.preventDefault();if(!connected){note('submit-status',t('请先连接 ECS。'),true);return}const goal=$('goal').value.trim();if(!goal)return;if(pending&&pending.goal!==goal){note('submit-status',t('上一条提交结果尚未确认，请先恢复原目标重试或在任务列表核对。'),true);$('goal').value=pending.goal;return}pending=pending||{requestId:crypto.randomUUID(),threadId,goal,source:{kind:'openbot'}};localStorage.setItem('openbot-bot-pending',JSON.stringify(pending));$('send').disabled=true;try{const b=await api('tasks','POST',pending);pending=null;localStorage.removeItem('openbot-bot-pending');$('goal').value='';note('submit-status',t('ECS 已接收：')+b.task.id+t('。可以关闭页面，稍后恢复查看。'));await refresh()}catch(e){note('submit-status',t('尚未确认接收；再次提交将沿用原请求编号，避免重复执行。')+e.message,true)}finally{$('send').disabled=false}};
$('refresh').onclick=refresh;
$('browse').onsubmit=async e=>{e.preventDefault();try{const b=await api('files?path='+encodeURIComponent($('directory').value));$('files').replaceChildren();for(const f of b.entries){const btn=document.createElement('button');btn.textContent=(f.type==='directory'?'📁 ':'📄 ')+f.name;btn.onclick=async()=>{try{if(f.type==='directory'){$('directory').value=f.path;$('browse').requestSubmit();return}const file=await api('file?path='+encodeURIComponent(f.path));$('preview').hidden=false;$('preview').textContent=file.path+'\nSHA256: '+file.sha256+'\n\n'+file.content}catch(e){note('files',e.message,true)}};$('files').append(btn)}}catch(e){note('files',e.message,true)}};
try{const c=await api('connection');note('connection',c.configured?t('已保存连接，可恢复查看原任务。'):t('请先配置 SSH 主机，然后填写 Bot 服务令牌。'));if(c.configured)$('connect').requestSubmit()}catch(e){note('connection',e.message,true)}
setInterval(refresh,3000);
</script></body></html>

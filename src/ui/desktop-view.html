<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电脑</title>
    <style>
      html, body, .stage { margin: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
      #vnc {
        position: absolute;
        top: 0;
        left: 0;
        border: 0;
        background: #000;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <iframe
        id="vnc"
        title="Remote desktop"
        tabindex="0"
        width="1280"
        height="800"
        allow="pointer-lock; fullscreen; clipboard-read; clipboard-write"
      ></iframe>
    </div>
    <script>
      const FRAME_W = 1280;
      const FRAME_H = 800;
      const stage = document.getElementById("stage");
      const frame = document.getElementById("vnc");
      const showBar = new URLSearchParams(location.search).get("bar") === "1";
      let localPort = 6080;

      function novncSrc() {
        const q = new URLSearchParams({
          autoconnect: "1",
          resize: "scale",
          reconnect: "1",
          encrypt: "0",
          host: "127.0.0.1",
          port: String(localPort),
          bar: showBar ? "1" : "0",
        });
        return "/novnc/vnc.html?" + q.toString();
      }

      function layout() {
        const sw = stage.clientWidth || 1;
        const sh = stage.clientHeight || 1;
        frame.style.width = FRAME_W + "px";
        frame.style.height = FRAME_H + "px";
        frame.style.transform = "scale(" + sw / FRAME_W + "," + sh / FRAME_H + ")";
        frame.style.left = "0";
        frame.style.top = "0";
      }

      async function connect() {
        try {
          const d = await (await fetch("/api/desktop")).json();
          if (d.localPort) localPort = Number(d.localPort) || localPort;
        } catch {
          /* keep default loopback port */
        }
        frame.src = novncSrc();
        frame.addEventListener("load", layout);
        layout();
      }

      window.addEventListener("resize", layout);
      new ResizeObserver(layout).observe(stage);
      connect();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电脑</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #111; overflow: visible; border-radius: 0; }
    </style>
  </head>
  <body>
    <script>
      const showBar = new URLSearchParams(location.search).get("bar") === "1";
      let localPort = 6080;

      function novncSrc() {
        const q = new URLSearchParams({
          autoconnect: "1",
          resize: "scale",
          reconnect: "1",
          encrypt: "0",
          host: "127.0.0.1",
          port: String(localPort),
          bar: showBar ? "1" : "0",
        });
        return "/novnc/vnc.html?" + q.toString();
      }

      async function connect() {
        try {
          const d = await (await fetch("/api/desktop")).json();
          if (d.localPort) localPort = Number(d.localPort) || localPort;
        } catch {
          /* keep default loopback port */
        }
        location.replace(novncSrc());
      }

      connect();
    </script>
  </body>
</html>
